name: Midnight Level 3 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # We must specify the working directory because the project is in a subfolder
    defaults:
      run:
        working-directory: ./decentralized-file-storage-tracker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './decentralized-file-storage-tracker/package-lock.json'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend Dependencies
        run: cd frontend && npm install && cd ..

      - name: Compile Compact Smart Contract
        run: npm run compile

      - name: Execute Automated Unit Tests
        run: npm run test

      - name: Verify Frontend Production Build
        run: npm run frontend:build
