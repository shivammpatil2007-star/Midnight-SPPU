name: Midnight Level 3 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
          if [ -d "decentralized-file-storage-tracker" ]; then
            cd decentralized-file-storage-tracker && npm install
          fi

      - name: Run Vitest Unit Tests
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm run test
          else
            cd decentralized-file-storage-tracker && npm run test
          fi

      - name: Build Frontend Production Bundle
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm install && npm run build
          elif [ -d "decentralized-file-storage-tracker/frontend" ]; then
            cd decentralized-file-storage-tracker/frontend && npm install && npm run build
          fi
