name: Midnight Level 3 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Locate & Install Root Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -f "decentralized-file-storage-tracker/package.json" ]; then
            cd decentralized-file-storage-tracker && npm install
          fi

      - name: Execute Contract Compilation
        run: |
          if [ -f "package.json" ]; then
            npm run compile
          else
            cd decentralized-file-storage-tracker && npm run compile
          fi

      - name: Run Vitest Suite
        run: |
          if [ -f "package.json" ]; then
            npm run test
          else
            cd decentralized-file-storage-tracker && npm run test
          fi

      - name: Build Frontend Application
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm install && npm run build
          else
            cd decentralized-file-storage-tracker/frontend && npm install && npm run build
          fi
